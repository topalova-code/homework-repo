<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="container-header">
        <h1>CSS Dinner Shopping List</h1>
        <p>Let’s go to the mall!</p>
    </header>

    <div class="container">
        <ul>

            <li>
                <label> <input type="checkbox"> A lot of pickles <span>(for the next lessons about CSS)</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">10 apples <span>(for more CSS manipulations)</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">20 oranges <span>(because they are awesome)</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">13 plates <span>(hm... they always dissapear)</span>
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">15 bentos
                </label>
            </li>
            <li>
                <label>
                    <input type="checkbox">1 bottle of Sake <span>(for my friends)</span>
                </label>
            </li>

        </ul>
    </div>

    <footer class="footer">
        <p>Bon appetit :)</p>
    </footer>

</body>

</html>
